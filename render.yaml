services:
  - type: web
    name: multi-agent-research-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    branch: master
    plan: free
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      # Set these to the deployed frontend's origin, otherwise the browser's
      # requests are rejected by CORS. Exact origin plus a regex for Vercel
      # preview builds, whose hostname changes per deployment.
      - key: CORS_ALLOW_ORIGINS
        sync: false
      - key: CORS_ALLOW_ORIGIN_REGEX
        sync: false
      # Generated once by Render, so tokens are not signed with a value
      # that is committed to this repository.
      - key: AUTH_SECRET
        generateValue: true
      # Render's proxy is the only route to the service, so trust its
      # X-Forwarded-For. Without this every request appears to come from the
      # proxy and the sign-up rate limit applies to all users at once.
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      # Accounts and history. Without this the app falls back to SQLite on
      # Render's ephemeral disk, and every restart deletes all users.
      - key: DATABASE_URL
        fromDatabase:
          name: multi-agent-research-db
          property: connectionString
      - key: PYTHONUNBUFFERED
        value: "1"
    healthCheckPath: /api/health

databases:
  - name: multi-agent-research-db
    plan: free
    databaseName: research
    user: research
    # Reachable only from services in this Render account.
    ipAllowList: []
